spring:
  application:
    name: pedro-api
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true
    properties:
      hibernate.jdbc.time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

pedro:
  risco:
    raio-metros: 500
    janela-dias: 90

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/pedro;MODE=PostgreSQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pedro}
    username: ${DB_USER:pedro}
    password: ${DB_PASSWORD:pedro}
